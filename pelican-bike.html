<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鹈鹕的海岸骑行</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #f6f1e7; color: #264a4a; font-family: 'Microsoft YaHei', system-ui, sans-serif; }
    main { width: min(1080px, 100%); padding: 36px 20px; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin: 0 8px 24px; }
    .eyebrow { font-size: 11px; letter-spacing: 4px; color: #728477; }
    h1 { margin: 10px 0 0; font-size: clamp(24px, 4vw, 40px); font-weight: 600; letter-spacing: 2px; }
    button { border: 1px solid #a9b9aa; border-radius: 30px; padding: 10px 19px; background: transparent; color: inherit; cursor: pointer; white-space: nowrap; }
    button:hover { background: #e6ecdf; }
    button:focus-visible { outline: 3px solid #da864b; outline-offset: 4px; }
    .scene { overflow: hidden; border-radius: 24px; box-shadow: 0 18px 60px #36594e14; background: #dbeee7; }
    svg { display: block; width: 100%; height: auto; }
    footer { display: flex; justify-content: space-between; margin: 20px 8px 0; font-size: 12px; color: #788578; letter-spacing: 1px; }
    .wheel { animation: spin 1.2s linear infinite; }
    .rear { transform-origin: 330px 419px; }
    .front { transform-origin: 646px 419px; }
    .crank { transform-origin: 465px 416px; animation: spin 1.2s linear infinite; }
    .rider { animation: bounce 1.2s ease-in-out infinite; }
    .wing { transform-origin: 439px 259px; animation: wing 1.2s ease-in-out infinite; }
    .scarf { transform-origin: 532px 222px; animation: flutter .6s ease-in-out infinite alternate; }
    .road { animation: travel 1.5s linear infinite; }
    .clouds { animation: drift 24s linear infinite; }
    .breeze { animation: breeze 2s ease-in-out infinite; }
    .paused * { animation-play-state: paused !important; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    @keyframes wing { 50% { transform: rotate(-3deg); } }
    @keyframes flutter { to { transform: rotate(7deg); } }
    @keyframes travel { to { transform: translateX(-180px); } }
    @keyframes drift { to { transform: translateX(-1000px); } }
    @keyframes breeze { 0%, 100% { opacity: .2; } 50% { opacity: .8; } }
    @media (max-width: 540px) { main { padding: 24px 12px; } header { align-items: center; } footer { font-size: 10px; } }
  </style>
</head>
<body>
<main>
  <header><div><div class="eyebrow">A LITTLE COASTAL ESCAPE</div><h1>鹈鹕，迎风骑行</h1></div><button id="toggle" type="button" aria-pressed="false">暂停动画</button></header>
  <div class="scene" id="scene">
    <svg viewBox="0 0 1000 600" role="img" aria-labelledby="title description" xmlns="http://www.w3.org/2000/svg">
      <title id="title">一只鹈鹕骑着薄荷绿自行车沿海岸前进</title>
      <desc id="description">橙色长嘴的白色鹈鹕系着红围巾，双脚循环踩踏，车轮持续旋转，海边的云朵和路面向后移动。</desc>
      <defs>
        <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#d4ebe5"/><stop offset="1" stop-color="#edf3df"/></linearGradient>
        <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#8fcac1"/><stop offset="1" stop-color="#b8dcd0"/></linearGradient>
        <g id="cloud" fill="#fffaf0"><path d="M0 26 Q0 9 23 12 Q30 -10 51 4 Q70 -6 80 14 Q103 10 109 26Z"/></g>
        <g id="spokes" stroke="#839f94" stroke-width="2"><path d="M-73 0H73 M0-73V73 M-52-52L52 52 M-52 52L52-52 M-68-28L68 28 M-28-68L28 68 M-68 28L68-28 M-28 68L28-68"/><circle r="62" fill="none" stroke="#fff6df" stroke-width="3"/><path d="M-8-64H8" stroke="#eaad5a" stroke-width="5"/></g>
      </defs>
      <path fill="url(#sky)" d="M0 0H1000V600H0Z"/>
      <circle cx="802" cy="111" r="51" fill="#f6d98d"/>
      <circle cx="802" cy="111" r="66" fill="#f6d98d" opacity=".16"/>
      <g class="clouds" opacity=".8"><use href="#cloud" x="110" y="97"/><use href="#cloud" x="450" y="59"/><use href="#cloud" x="870" y="155"/><use href="#cloud" x="1110" y="97"/><use href="#cloud" x="1450" y="59"/><use href="#cloud" x="1870" y="155"/></g>
      <path d="M0 295Q145 249 285 291T560 284T805 287T1000 264V380H0Z" fill="#aacbbe"/>
      <path d="M0 315Q240 300 480 316T1000 310V432H0Z" fill="url(#sea)"/>
      <g fill="none" stroke="#edf5e5" stroke-width="3" stroke-linecap="round" opacity=".65"><path d="M58 342h100m37 19h70m451-26h112m-72 39h165M12 391h150m677 10h85"/></g>
      <path d="M0 420Q280 376 558 408T1000 411V600H0Z" fill="#ebdcb8"/>
      <path d="M0 457Q350 441 1000 453V556H0Z" fill="#d3c8ac"/>
      <path d="M0 556H1000" stroke="#f6e9c9" stroke-width="4"/>
      <g class="road" stroke="#f7edd5" stroke-width="4" stroke-linecap="round"><path d="M-100 522h65m115 0h65m115 0h65m115 0h65m115 0h65m115 0h65m115 0h65m115 0h65"/></g>
      <ellipse cx="485" cy="501" rx="243" ry="14" fill="#797e67" opacity=".16"/>
      <g fill="none" stroke="#344e4c" stroke-width="10"><circle cx="330" cy="419" r="78"/><circle cx="646" cy="419" r="78"/></g>
      <g class="wheel rear"><use href="#spokes" x="330" y="419"/></g><g class="wheel front"><use href="#spokes" x="646" y="419"/></g>
      <!-- The far leg and near leg use opposite phases of the same pedal cycle. -->
      <g stroke="#c48539" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"><path id="far-leg" d="M430 310L414 371L435 416"/></g>
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M330 419L405 322L465 416Z M405 322L590 322L465 416 M590 322L646 419 M465 416L421 303" stroke="#397c71" stroke-width="10"/>
        <path d="M335 414L405 328L457 409 M414 323H579" stroke="#83baa0" stroke-width="3"/>
        <path d="M590 322L574 274L596 260H615" stroke="#344e4c" stroke-width="8"/>
        <path d="M606 260H622" stroke="#a86744" stroke-width="10"/>
        <path d="M395 301H444" stroke="#644e40" stroke-width="12"/>
        <path d="M330 419L465 403Q482 405 482 418Q482 433 465 431L330 424Z" stroke="#60756b" stroke-width="3"/>
      </g>
      <circle cx="330" cy="419" r="8" fill="#344e4c"/><circle cx="646" cy="419" r="8" fill="#344e4c"/>
      <circle cx="465" cy="416" r="20" fill="#e5dfc7" stroke="#397c71" stroke-width="5"/>
      <g class="crank" stroke="#405955" stroke-width="5"><path d="M435 416H495"/><circle cx="465" cy="416" r="5" fill="#405955"/></g>
      <g class="rider">
        <path d="M385 272L342 246L354 290L388 307" fill="#e9e9d8" stroke="#536962" stroke-width="3" stroke-linejoin="round"/>
        <path d="M382 250Q425 222 477 245Q492 235 491 207L489 163Q488 124 520 119Q557 114 567 145Q573 170 551 190L541 243Q534 284 490 308Q452 329 410 305Q378 289 382 250Z" fill="#fffdf0" stroke="#536962" stroke-width="3"/>
        <path d="M393 282Q430 316 474 297Q517 282 527 240Q532 263 516 286Q469 336 415 304Z" fill="#dfe5d5"/>
        <path d="M545 158L668 174Q635 197 553 188Q540 178 545 158Z" fill="#eab354" stroke="#986e3d" stroke-width="2.5"/>
        <path d="M552 181Q592 234 637 191L664 177Q615 191 552 181Z" fill="#f3cd78" stroke="#986e3d" stroke-width="2.5"/>
        <path d="M549 162L670 174L552 178" fill="#ef9a40" stroke="#986e3d" stroke-width="2.5" stroke-linejoin="round"/>
        <circle cx="537" cy="150" r="7" fill="#fff"/><circle cx="539" cy="151" r="4" fill="#263e3a"/><circle cx="540" cy="149" r="1.2" fill="#fff"/>
        <path d="M516 132Q525 126 536 131 M501 123L495 111 M509 121L507 107" fill="none" stroke="#536962" stroke-width="3" stroke-linecap="round"/>
        <g class="scarf"><path d="M528 219Q484 201 445 214L457 225L437 234Q489 225 524 234" fill="#d77155"/><path d="M514 224Q478 232 454 256L477 252L478 265Q502 244 530 233" fill="#bc5e49"/></g>
        <path d="M493 210Q514 224 539 214L536 231Q511 237 492 226Z" fill="#de7959"/>
        <path class="wing" d="M417 251Q439 235 466 258L496 277Q537 278 585 259L592 269Q548 300 492 295Q447 296 417 269" fill="#f2f1df" stroke="#536962" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M426 261Q443 279 470 282" fill="none" stroke="#c5cebc" stroke-width="3" stroke-linecap="round"/>
      </g>
      <path id="near-leg" d="M456 310L486 361L495 416" fill="none" stroke="#e7aa4f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="far-foot" d="M423 416H449" stroke="#bd8139" stroke-width="10" stroke-linecap="round"/>
      <path id="near-foot" d="M483 416H509" stroke="#edb551" stroke-width="11" stroke-linecap="round"/>
      <g class="breeze" fill="none" stroke="#fffaf0" stroke-width="3" stroke-linecap="round"><path d="M270 221h59m-89 22h72m-30 23h35"/></g>
      <g stroke="#869878" stroke-width="3" fill="none" stroke-linecap="round"><path d="M74 440l-9-24m9 24l12-32m-12 32l24-15M891 461l-13-27m13 27l9-37m-9 37l26-21"/></g>
      <g fill="#faf0d3"><ellipse cx="143" cy="569" rx="8" ry="3"/><ellipse cx="830" cy="581" rx="12" ry="3"/><ellipse cx="862" cy="572" rx="5" ry="2"/></g>
    </svg>
  </div>
  <footer><span>海风正好，慢慢向前。</span><span>SVG · COASTAL RIDE</span></footer>
</main>
<script>
  const scene = document.getElementById('scene');
  const button = document.getElementById('toggle');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  let paused = reducedMotion.matches;
  let elapsed = 0;
  let previousTime;
  const nearLeg = document.getElementById('near-leg');
  const farLeg = document.getElementById('far-leg');
  const nearFoot = document.getElementById('near-foot');
  const farFoot = document.getElementById('far-foot');
  function updateState() {
    scene.classList.toggle('paused', paused);
    button.textContent = paused ? '播放动画' : '暂停动画';
    button.setAttribute('aria-pressed', String(paused));
  }
  button.addEventListener('click', () => { paused = !paused; updateState(); });
  reducedMotion.addEventListener('change', event => { paused = event.matches; updateState(); });
  function drawLeg(leg, foot, angle, hipX) {
    const x = 465 + Math.cos(angle) * 30;
    const y = 416 + Math.sin(angle) * 30;
    const bob = 1.5 - 1.5 * Math.cos(angle * 2);
    leg.setAttribute('d', `M${hipX} ${310 + bob} Q${x + 27} ${350 + (y - 416) * .35} ${x} ${y}`);
    foot.setAttribute('d', `M${x - 11} ${y} h25`);
  }
  function frame(time) {
    if (previousTime !== undefined && !paused) elapsed += time - previousTime;
    previousTime = time;
    const angle = elapsed / 1200 * Math.PI * 2;
    drawLeg(nearLeg, nearFoot, angle, 456);
    drawLeg(farLeg, farFoot, angle + Math.PI, 430);
    requestAnimationFrame(frame);
  }
  updateState();
  requestAnimationFrame(frame);
</script>
</body>
</html>
